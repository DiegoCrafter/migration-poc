name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - master

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install tox flake8 coverage

      - name: Run tox
        run: tox

  deploy_to_gcp:
    runs-on: ubuntu-latest
    env:
      REGION: us-central1
      INSTANCE_CONNECTION_NAME: ${{ secrets.GCP_PROJECT_ID }}:us-central1:globant-cde-db
      DATABASE_NAME: challenge_database
      DATABASE_USER: postgres

    steps:
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 416.0.0
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure Docker to use gcloud as a credential helper
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Deploy database schema
        run: |
          gcloud sql connect $CLOUD_SQL_CONNECTION_NAME --user=root --password=${{ secrets.DB_PASSWORD }} < database/database.sql
          gcloud sql connect $CLOUD_SQL_CONNECTION_NAME --user=root --password=${{ secrets.DB_PASSWORD }} -e "USE $DB_NAME;" < database/database.sql

      - name: Build Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gdec-artifactory/globant-cde-app .

      - name: Push Docker image to GCR
        run: |
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gdec-artifactory/globant-cde-app

      - name: Deploy to GCP
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gdec-artifactory/globant-cde-app"
          gcloud run deploy globant-cde-app \
            --image $IMAGE \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated

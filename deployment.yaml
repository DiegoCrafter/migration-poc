apiVersion: apps/v1
kind: Deployment
metadata:
  name: globant-cde-deployment
  labels:
    app: globant-cde-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: globant-cde-app
  template:
    metadata:
      labels:
        app: globant-cde-app
    spec:
      containers:
      - name: globant-cde-container
        image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gdec-artifactory/globant-cde-app:latest
        ports:
        - containerPort: 8000
      resources:
        requests:
          memory: "128Mi"
          cpu: "250m"
        limits:
          memory: "256Mi"
          cpu: "500m"
